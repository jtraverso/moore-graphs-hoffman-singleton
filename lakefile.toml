name = "moore_graphs"
version = "0.1.0"
defaultTargets = ["MooreLib", "Challenge", "Solution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "MooreLib"
globs = ["MooreLib.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
