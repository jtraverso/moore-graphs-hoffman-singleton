# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Moore graphs of diameter two: the Hoffman–Singleton theorem"
  description: >-
    A Lean 4 / Mathlib formalization of the Hoffman–Singleton theorem on Moore graphs of diameter
    two. For a finite k-regular graph of diameter at most two: the Moore bound n ≤ k² + 1; if
    moreover the girth is at least five, then n = k² + 1 and the graph is strongly regular with
    parameters (k² + 1, k, 0, 1); and, if k ≥ 2, then k ∈ {2, 3, 7, 57}. Mathlib has strongly
    regular graphs and the spectral theorem for Hermitian matrices, but not this theorem.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C50", "05C35", "05E30"]

sources:
  - title: "On Moore Graphs with Diameters 2 and 3"
    authors:
      - "A. J. Hoffman"
      - "R. R. Singleton"
    id: "doi:10.1147/rd.45.0497"
    type: "paper"
    location: "IBM Journal of Research and Development 4 (1960), 497–504"
    relationship: "formalizes"
    note: >-
      The diameter-two case: the Moore bound, the strongly regular structure of Moore graphs of
      diameter two, and the eigenvalue argument showing k ∈ {2, 3, 7, 57}. The diameter-three
      results of the paper are not formalized.
    license: "all rights reserved"
    author_endorsement: "n/a"

status:
  scope: >-
    Proved for every finite vertex type and every k (the Moore bound, n = k² + 1 and strong
    regularity), and for every k ≥ 2 (the classification k ∈ {2, 3, 7, 57}).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced all proofs in one run from the formal statements and a proof plan; the return was
        audited (statements and headers unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "about two hours"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, proof plan, integration and review of the Aristotle return, and the
        Palomar packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3,
        Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound,
    identical elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    A Moore graph of diameter two is expressed by its hypotheses: a finite simple graph on a
    nonempty vertex type that is k-regular (Mathlib's `IsRegularOfDegree`), has extended diameter
    at most two (`ediam ≤ 2`, which also forces connectedness) and extended girth at least five
    (`5 ≤ egirth`). The Moore bound needs only regularity and diameter at most two; the
    classification assumes k ≥ 2 (k = 1 is the single-edge graph K₂, which satisfies the other
    hypotheses). Strong regularity is Mathlib's `IsSRGWith`.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with the Hoffman–Singleton theorem, checked edge cases (empty vertex
    type, k = 0 and k = 1), checked that the Aristotle return left every statement and header
    unchanged, and confirmed by `lake build`, `#print axioms` and a comparison of the fully
    elaborated Challenge and Solution types that the proofs use no `sorry` and only propext,
    Classical.choice and Quot.sound. The author directed the work and approved the statements. No
    independent human mathematical review has been performed. The result is classical; no
    mathematical novelty is claimed.

alignment:
  namespace: "HoffmanSingleton"
  statements:
    - source: "Moore bound for diameter two"
      lean: "HoffmanSingleton.card_le"
      module: "Challenge"
      status: "proved"
    - source: "Moore graphs of diameter two have k² + 1 vertices"
      lean: "HoffmanSingleton.card_eq"
      module: "Challenge"
      status: "proved"
    - source: "Moore graphs of diameter two are strongly regular (k² + 1, k, 0, 1)"
      lean: "HoffmanSingleton.isSRGWith"
      module: "Challenge"
      status: "proved"
    - source: "Hoffman–Singleton (1960): k ∈ {2, 3, 7, 57}"
      lean: "HoffmanSingleton.hoffman_singleton"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle.
